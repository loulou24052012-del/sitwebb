<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Montagnes du Monde</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<style>
body {
  font-family: Arial;
  text-align: center;
  background: #e3f2fd;
}

.container {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
}

.card {
  background: white;
  margin: 15px;
  padding: 15px;
  border-radius: 15px;
  width: 280px;
}

img {
  width: 100%;
  border-radius: 10px;
  cursor: pointer;
}

.details {
  display: none;
  margin-top: 10px;
  background: #f1f1f1;
  padding: 10px;
  border-radius: 10px;
}

.map {
  height: 200px;
  margin-top: 10px;
  display: none;
}

/* TROLL */
#trollOverlay {
  position: fixed;
  top:0;
  left:0;
  width:100%;
  height:100%;
  background:black;
  display:none;
  justify-content:center;
  align-items:center;
}

#trollOverlay img {
  width:100%;
  height:100%;
  object-fit:cover;
}
</style>
</head>

<body>

<h1>🏔️ Montagnes du Monde</h1>
<div id="container"></div>

<div id="trollOverlay">
  <img id="trollImage">
</div>

<script>

// 📊 TOUTES LES MONTAGNES
const montagnes = [
  {
    nom:"Mont Everest",
    image:"everest.jpg",
    hauteur:"8848 m",
    pays:"Népal / Chine",
    texte:"Le Mont Everest est le plus haut sommet du monde.",
    lien:"https://fr.wikipedia.org/wiki/Mont_Everest",
    lat:27.9881, lng:86.9250
  },
  {
    nom:"K2",
    image:"k2.jpg",
    hauteur:"8611 m",
    pays:"Pakistan / Chine",
    texte:"Le K2 est le deuxième plus haut sommet du monde.",
    lien:"https://fr.wikipedia.org/wiki/K2",
    lat:35.8800, lng:76.5133
  },
  {
    nom:"Mont Blanc",
    image:"montblanc.jpg",
    hauteur:"4808 m",
    pays:"France / Italie",
    texte:"Le Mont Blanc est le plus haut sommet des Alpes.",
    lien:"https://fr.wikipedia.org/wiki/Mont_Blanc",
    lat:45.8326, lng:6.8652
  },
  {
    nom:"Mont Fuji",
    image:"fuji.jpg",
    hauteur:"3776 m",
    pays:"Japon",
    texte:"Le Mont Fuji est le symbole du Japon.",
    lien:"https://fr.wikipedia.org/wiki/Mont_Fuji",
    lat:35.3606, lng:138.7274
  },
  {
    nom:"Denali",
    image:"denali.jpg",
    hauteur:"6190 m",
    pays:"USA",
    texte:"Le Denali est le plus haut sommet d'Amérique du Nord.",
    lien:"https://fr.wikipedia.org/wiki/Denali",
    lat:63.0695, lng:-151.0067
  },
  {
    nom:"Aconcagua",
    image:"aconcagua.jpg",
    hauteur:"6961 m",
    pays:"Argentine",
    texte:"L’Aconcagua est le plus haut sommet d'Amérique du Sud.",
    lien:"https://fr.wikipedia.org/wiki/Aconcagua",
    lat:-32.6532, lng:-70.0109
  }
];

// 😈 TROLL
const trolls = ["troll1.jpg","troll2.jpg","troll3.jpg","troll4.jpg","troll5.jpg","troll6.jpg"];

function afficher() {
  const container = document.getElementById("container");

  montagnes.forEach(m => {

    const card = document.createElement("div");
    card.className = "card";

    card.innerHTML = `
      <h2>${m.nom}</h2>
      <img src="${m.image}">
      <p>${m.hauteur}</p>
      <p>${m.pays}</p>
      <div class="details"></div>
      <div class="map"></div>
    `;

    const img = card.querySelector("img");
    const details = card.querySelector(".details");
    const mapDiv = card.querySelector(".map");

    // 📍 CARTE
    img.addEventListener("click", () => {
      mapDiv.style.display = "block";

      const map = L.map(mapDiv).setView([m.lat, m.lng], 10);

      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
      L.marker([m.lat, m.lng]).addTo(map);
    });

    // 📖 INFOS
    mapDiv.addEventListener("click", () => {
      details.style.display = "block";
      details.innerHTML = `
        <p>${m.texte}</p>
        <a href="${m.lien}" target="_blank">🔗 Wikipédia</a>
      `;
    });

    // 😈 TROLL
    img.addEventListener("dblclick", () => {
      const r = trolls[Math.floor(Math.random()*trolls.length)];
      document.getElementById("trollImage").src = r;
      document.getElementById("trollOverlay").style.display = "flex";
    });

    container.appendChild(card);
  });
}

// fermer troll
document.getElementById("trollOverlay").onclick = () => {
  document.getElementById("trollOverlay").style.display = "none";
};

afficher();

</script>

</body>
</html>
